; Lil Smoove V1 — Orgo-native Supervisor program
; Replaces the image-provided hermes-gateway program on the owner-designated
; fresh target. No channel integrations, cron jobs, or public listener are set.

[program:hermes-gateway]
command=/home/orgo/lil-smoove/gateway-run.sh
directory=/home/orgo/lil-smoove/workspace
user=root
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=HOME="/home/orgo/lil-smoove/home",HERMES_HOME="/home/orgo/lil-smoove/home/.hermes",PATH="/home/orgo/lil-smoove/runtime/venv/bin:/usr/local/bin:/usr/bin:/bin"
stdout_logfile=/home/orgo/lil-smoove/logs/gateway.log
stderr_logfile=/home/orgo/lil-smoove/logs/gateway.err
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
