; Lil Smoove — owner-only Telegram messaging gateway.
; Runs beside the existing loopback TUI backend. Supervisor owns one instance.

[program:lil-smoove-messaging-gateway]
command=/home/orgo/lil-smoove/messaging-gateway-run.sh
directory=/home/orgo/lil-smoove/workspace
user=root
autostart=true
autorestart=unexpected
exitcodes=0,75
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
environment=HOME="/home/orgo/lil-smoove/home",HERMES_HOME="/home/orgo/lil-smoove/home/.hermes",PATH="/home/orgo/lil-smoove/runtime/venv/bin:/usr/local/bin:/usr/bin:/bin",PYTHONUNBUFFERED="1"
stdout_logfile=/home/orgo/lil-smoove/logs/messaging-gateway.log
stderr_logfile=/home/orgo/lil-smoove/logs/messaging-gateway.err
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
